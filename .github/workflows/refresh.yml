name: Refresh Korea Herald feed

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install requests beautifulsoup4

      - name: Restore historical articles from Git history
        run: python tools/restore_article_history.py

      - name: Restore any missing image links
        run: python tools/repair_article_images.py

      - name: Refresh article data
        run: python tools/update_articles.py

      - name: Commit refreshed feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/articles.json
          if git diff --cached --quiet; then
            echo "No feed changes."
          else
            git commit -m "Refresh portfolio articles"
            git push
          fi
