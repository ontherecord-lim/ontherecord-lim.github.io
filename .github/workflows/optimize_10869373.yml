name: Optimize archived Hanwha article screenshot
on:
  push:
    paths:
      - '.github/workflows/optimize_10869373.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - name: Save compact full-size preview
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          src=Path('assets/article-captures/10869373.png')
          if not src.exists():
            raise SystemExit('Original screenshot is missing')
          im=Image.open(src).convert('RGB')
          print('Original screenshot:', im.size)
          out=src.with_suffix('.webp')
          im.save(out, format='WEBP', quality=86, method=6)
          print('Optimized image:', out, out.stat().st_size)
          # Keep the publisher's masthead, article headline, Lim Ye-jin byline,
          # published photo, and main column through the reporter contact.
          # Exclude the unrelated right rail and lower-page recommendations.
          crop=im.crop((0, 0, min(700, im.width), min(3250, im.height)))
          focused=src.with_name('10869373_article.webp')
          crop.save(focused, format='WEBP', quality=89, method=6)
          print('Focused capture:', focused, crop.size, focused.stat().st_size)
          PY
      - name: Commit optimized capture
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/article-captures/10869373.webp assets/article-captures/10869373_article.webp
          if ! git diff --cached --quiet; then
            git commit -m "Add optimized verified Hanwha article screenshot"
            for attempt in 1 2 3 4; do
              git pull --rebase origin main
              if git push origin HEAD:main; then break; fi
              if [ "$attempt" -eq 4 ]; then exit 1; fi
              sleep 2
            done
          fi
