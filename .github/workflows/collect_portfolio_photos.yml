name: Collect portfolio article cover photographs
on:
  push:
    paths:
      - '.github/workflows/collect_portfolio_photos.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install imaging tools
        run: python -m pip install requests beautifulsoup4 pillow
      - name: Retrieve publisher image metadata and cover photos
        run: |
          python - <<'PY'
          import requests, json, re, io, os, pathlib
          from bs4 import BeautifulSoup
          from PIL import Image
          out=pathlib.Path('portfolio-cover-images');out.mkdir(exist_ok=True)
          headers={'User-Agent':'Mozilla/5.0 (compatible; journalist-portfolio/1.0)'}
          sources={
          'hanwha':'10869373',
          'lx_pantos':'10867554',
          'amcham':'10870604',
          'eximbank':'10875607'}
          metadata={}
          session=requests.Session()
          for label,aid in sources.items():
            url=f'https://www.koreaherald.com/article/{aid}'
            try:
              page=session.get(url,headers=headers,timeout=30)
              page.raise_for_status()
              soup=BeautifulSoup(page.text,'html.parser')
              candidates=[]
              for attr in (('property','og:image'),('name','twitter:image')):
                n=soup.find('meta',attrs={attr[0]:attr[1]})
                if n and n.get('content'):candidates.append(n['content'])
              if label=='hanwha':candidates.append('https://wimg.heraldcorp.com/news/cms/2026/09/10/news-p.v1.20260910.26ebb6103f6842518feffa103598b3ac_P1.jpg')
              attempts=[]
              for link in candidates:
                try:
                  image=session.get(link,headers={**headers,'Referer':url},timeout=25)
                  image.raise_for_status()
                  img=Image.open(io.BytesIO(image.content)).convert('RGB')
                  if img.width<240 or img.height<140:continue
                  img.thumbnail((1200,800))
                  target=out/(label+'.jpg')
                  img.save(target,quality=84,optimize=True)
                  metadata[label]={'article':url,'image':link,'size':list(img.size),'bytes':target.stat().st_size}
                  print('SUCCESS',label,metadata[label])
                  break
                except Exception as exc:attempts.append(str(exc))
              if label not in metadata: metadata[label]={'error':' | '.join(attempts),'candidate_images':candidates}
            except Exception as exc: metadata[label]={'error':str(exc)}
          (out/'manifest.json').write_text(json.dumps(metadata,indent=2),encoding='utf-8')
          print(json.dumps(metadata,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: portfolio-original-cover-photos
          path: portfolio-cover-images/
          if-no-files-found: error
          retention-days: 7
