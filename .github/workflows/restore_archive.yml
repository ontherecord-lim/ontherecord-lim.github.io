name: Restore historical reporting archive

on:
  push:
    paths:
      - 'tools/restore_article_history.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore all article revisions
        run: python tools/restore_article_history.py
      - name: Save complete archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/articles.json
          if ! git diff --cached --quiet; then
            git commit -m "Recover historical reporting articles"
            git push
          fi
