name: Repair broken article images
on:
  push:
    paths:
      - '.github/workflows/repair_article_images.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install requests beautifulsoup4
      - name: Restore publisher photo URLs for missing local assets
        run: python tools/repair_article_images.py
      - name: Commit recovered URLs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/articles.json
          if git diff --cached --quiet; then
            echo "No verified publisher URLs recovered."
          else
            git commit -m "Repair missing article cover image URLs"
            git push
          fi
